<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>숲속 친구들 대작전 · 선생님</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/teacher.css" />
</head>
<body class="teacher">
  <header>
    <div>
      <div class="t-title">🐻 숲속 친구들 대작전 <small>선생님 화면</small></div>
      <div class="t-join">학생 접속 주소: <b id="url"></b></div>
      <div class="t-class">학급 이름 <input id="class-name" maxlength="12" placeholder="예: 5-2" /> <small>학급마다 별·기록이 이 컴퓨터에 따로 저장돼요</small></div>
    </div>
    <div class="code-box">방 코드<div id="code">····</div></div>
  </header>

  <div class="t-actions">
    <button id="start-all" class="big">▶ 모든 모둠 시작</button>
    <button id="lobby-all" class="t-btn">🏠 모두 대기실로</button>
    <button id="unlock-all" class="t-btn">🔓 모든 단계 열기</button>
    <button id="reset-records" class="t-btn">🧹 기록 초기화</button>
    <button id="new-room" class="t-btn">새 방 만들기</button>
    <button id="noise-toggle" class="t-btn">🎤 소음 감지 켜기</button>
    <span id="t-stat"></span>
  </div>
  <div id="noise-box" class="hidden">
    <div class="noise-meter"><div id="noise-bar"></div><div id="noise-mark"></div></div>
    <label>경고 기준 <input id="noise-limit" type="range" min="30" max="95" /> <b id="noise-limit-num"></b></label>
    <small>지금 소리 <b id="noise-now">0</b> · 게임 중에 기준을 2초 넘게 넘으면 경고해요. 소리는 녹음하거나 보내지 않아요.</small>
  </div>
  <div id="noise-err" class="hidden"></div>

  <main id="teams" class="t-grid"></main>
  <section id="rank" class="t-rank hidden"></section>

  <div id="noise-alert" class="hidden">
    <div class="noise-card">
      <div class="noise-icon">🔊</div>
      <h2>너무 시끄러워요!</h2>
      <p>확인을 누르면 모든 모둠이 대기실로 돌아가요.</p>
      <button id="noise-ok" class="big">확인</button>
      <button id="noise-skip" class="t-btn">계속 진행하기</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/teacher.js"></script>
</body>
</html>
