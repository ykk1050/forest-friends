<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>동물 친구들 미리보기</title>
  <style>
    html, body { margin: 0; height: 100%; background: #bfe8ff; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; }
    canvas { display: block; }
    #names { position: fixed; bottom: 16px; left: 0; right: 0; display: flex; justify-content: space-around; font-size: 20px; font-weight: 800; color: #3b2a1a; }
    #poses { position: fixed; top: 12px; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 0 12px; }
    #poses button { font: inherit; font-size: 17px; font-weight: 800; padding: 8px 14px; border-radius: 12px; border: 3px solid #e8d9b8; background: #fffdf6; cursor: pointer; }
    #poses button.on { border-color: #ff8a3d; background: #fff1e4; }
  </style>
  <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
</head>
<body>
  <div id="poses">
    <button data-pose="walk" class="on">🚶 걷기</button>
    <button data-pose="push">💪 바구니 밀기</button>
    <button data-pose="strain">😣 안 밀려서 동동</button>
    <button data-mood="dizzy">😵 부딪힘</button>
    <button data-mood="happy">😊 성공 깡충</button>
  </div>
  <div id="names"><span>🐻 곰</span><span>🐰 토끼</span><span>🦊 여우</span><span>🐼 판다</span><span>🐧 펭귄</span><span>🦉 선생님</span></div>
  <script type="module">
    import * as THREE from 'three';
    import { makeAnimal } from '/js/animals.js';
    import { COLORS } from '/shared/constants.js';
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbfe8ff);
    const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    cam.position.set(0, 3.4, 15); cam.lookAt(0, 0.9, 0);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x88aa77, 1.5));
    const sun = new THREE.DirectionalLight(0xfff4e0, 1.9);
    sun.position.set(-4, 8, 6); sun.castShadow = true; scene.add(sun);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), new THREE.MeshLambertMaterial({ color: 0x8fd16a }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
    const kinds = ['bear', 'rabbit', 'fox', 'panda', 'penguin', 'owl'];
    const list = kinds.map((k, i) => {
      const a = makeAnimal(k, COLORS[i]);
      a.root.position.x = (i - 2.5) * 1.35;
      a.root.rotation.y = -Math.PI / 2 + 0.5;   // 카메라 쪽으로
      scene.add(a.root);
      return a;
    });
    // 자세 버튼: 걷기·밀기·동동은 계속, 부딪힘·깡충은 한 번
    let pose = 'walk';
    document.querySelectorAll('#poses button').forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.mood) { list.forEach((a) => a.setMood(b.dataset.mood, b.dataset.mood === 'happy' ? 1.6 : 1.2)); return; }
      pose = b.dataset.pose;
      document.querySelectorAll('#poses [data-pose]').forEach((x) => x.classList.toggle('on', x === b));
    }));
    const resize = () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); };
    addEventListener('resize', resize); resize();
    let last = performance.now();
    renderer.setAnimationLoop((now) => {
      const dt = (now - last) / 1000; last = now;
      const t = now / 1000;
      list.forEach((a, i) => {
        if (pose === 'walk') a.animate(dt, (Math.sin(t * 0.8 + i) + 1) / 2, false, t);
        else a.animate(dt, pose === 'push' ? 0.5 : 0, true, t, { push: pose === 'push', strain: pose === 'strain' });
      });
      renderer.render(scene, cam);
    });
  </script>
</body>
</html>
